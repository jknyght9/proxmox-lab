site_name: Proxmox Lab
site_url: https://jknyght9.github.io/proxmox-lab
site_author: Jacob Stauffer | CISSP
site_description: >-
  Infrastructure-as-Code for Proxmox VE — automated deployment of a self-hosted home lab
repo_name: jknyght9/proxmox-lab
repo_url: https://github.com/jknyght9/proxmox-lab

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.tasklist:
      clickable_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting Started:
      - Prerequisites: getting-started/prerequisites.md
      - Bootstrap Configuration: getting-started/bootstrap.md
      - First Deployment: getting-started/first-deploy.md
  - Architecture:
      - Overview: architecture/overview.md
      - Networking: architecture/networking.md
      - Secrets Management: architecture/secrets.md
  - Services:
      - Vault: services/vault.md
      - Traefik: services/traefik.md
      - Authentik: services/authentik.md
      - Pi-hole DNS: services/pihole-dns.md
      - Samba AD: services/samba-ad.md
      - Kasm Workspaces: services/kasm.md
      - Netbox: services/netbox.md
      - Uptime Kuma: services/uptime-kuma.md
  - Tutorials:
      - Import Root CA: tutorials/import-root-ca.md
      - Kasm AD Authentication: tutorials/kasm-ad-auth.md
      - NAS Domain Join: tutorials/nas-domain-join.md
      - HA Configuration: tutorials/ha-configuration.md
      - Managing AD Users: tutorials/adding-ad-users.md
  - Operations:
      - Menu Reference: operations/menu-reference.md
      - Rollback and Purge: operations/rollback-purge.md
      - Troubleshooting: operations/troubleshooting.md
      - Dependency Manifest: operations/dependencies.md
  - Developer Guide:
      - Adding Services: developer/adding-services.md
