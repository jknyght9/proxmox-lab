name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main

# mkdocs gh-deploy pushes the built site to the gh-pages branch, which needs
# write access to repo contents. Without this the default GITHUB_TOKEN is
# read-only and the deploy fails with a 403 on push.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install dependencies
        run: pip install mkdocs mkdocs-material
      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
